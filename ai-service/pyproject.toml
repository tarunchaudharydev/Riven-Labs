[project]
name = "riven-timetable-ai"
version = "0.2.0"
description = "AI-assisted, deterministic timetable scheduling services"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.142.4",
    "google-genai>=2.29.0",
    "ortools>=9.14.0,<10",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "httpx>=0.28.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
