"""
Institutional scheduling data. Every tenant-owned table carries institutionId
and references the Institution table so connector operations can enforce tenant
boundaries with Firebase Authentication custom claims.

The trusted identity claims used by this schema are institutionId, role, and,
for student viewers, sectionId. Only a trusted Firebase Admin SDK process may
assign or change those claims.
"""

enum DayOfWeek {
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
  SUNDAY
}

enum RoomType {
  CLASSROOM
  LABORATORY
  LECTURE_HALL
}

enum SessionType {
  LECTURE
  LABORATORY
}

enum AvailabilityType {
  AVAILABLE
  UNAVAILABLE
  PREFERRED
}

enum TimetableStatus {
  DRAFT
  VALIDATED
  APPROVED
  PUBLISHED
  ARCHIVED
}

enum GenerationJobStatus {
  QUEUED
  RUNNING
  FEASIBLE
  OPTIMAL
  INFEASIBLE
  FAILED
  CANCELLED
}

enum AbsenceStatus {
  REPORTED
  CANCELLED
  RESOLVED
}

enum SubstitutionStatus {
  PROPOSED
  APPROVED
  REJECTED
  CANCELLED
}

type Institution @table(key: "id") {
  id: String!
  name: String!
  code: String! @unique
  createdAt: Timestamp! @default(expr: "request.time")
}

type UserProfile @table(key: "uid") {
  uid: String!
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  email: String!
  displayName: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Department @table @unique(fields: ["institutionId", "code"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  code: String!
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type AcademicTerm @table @unique(fields: ["institutionId", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  name: String!
  academicYear: String!
  startsOn: Date!
  endsOn: Date!
  workingDays: [DayOfWeek!]!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Faculty @table @unique(fields: ["institutionId", "employeeId"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  departmentId: UUID!
  department: Department! @ref(fields: "departmentId", references: "id")
  linkedUserUid: String
  employeeId: String!
  fullName: String!
  email: String!
  maxWeeklyPeriods: Int!
  isActive: Boolean!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Subject @table @unique(fields: ["institutionId", "code"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  departmentId: UUID!
  department: Department! @ref(fields: "departmentId", references: "id")
  code: String!
  name: String!
  roomType: RoomType!
  requiredEquipment: [String!]!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Section @table @unique(fields: ["institutionId", "code", "academicYear"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  departmentId: UUID!
  department: Department! @ref(fields: "departmentId", references: "id")
  academicTermId: UUID!
  academicTerm: AcademicTerm! @ref(fields: "academicTermId", references: "id")
  code: String!
  semester: Int!
  academicYear: String!
  studentCount: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Room @table @unique(fields: ["institutionId", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  name: String!
  roomType: RoomType!
  capacity: Int!
  equipment: [String!]!
  createdAt: Timestamp! @default(expr: "request.time")
}

type TimeSlot @table @unique(fields: ["institutionId", "dayOfWeek", "periodNumber"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  dayOfWeek: DayOfWeek!
  periodNumber: Int!
  startsAt: String!
  endsAt: String!
  isTeachingPeriod: Boolean!
}

type FacultySubject @table @unique(fields: ["facultyId", "subjectId", "sectionId"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  facultyId: UUID!
  faculty: Faculty! @ref(fields: "facultyId", references: "id")
  subjectId: UUID!
  subject: Subject! @ref(fields: "subjectId", references: "id")
  sectionId: UUID!
  section: Section! @ref(fields: "sectionId", references: "id")
}

type FacultyAvailability @table @unique(fields: ["facultyId", "dayOfWeek", "periodNumber"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  facultyId: UUID!
  faculty: Faculty! @ref(fields: "facultyId", references: "id")
  dayOfWeek: DayOfWeek!
  periodNumber: Int!
  availability: AvailabilityType!
}

type RoomAvailability @table @unique(fields: ["roomId", "dayOfWeek", "periodNumber"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  roomId: UUID!
  room: Room! @ref(fields: "roomId", references: "id")
  dayOfWeek: DayOfWeek!
  periodNumber: Int!
  isAvailable: Boolean!
}

type TeachingRequirement @table @unique(fields: ["sectionId", "subjectId"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  sectionId: UUID!
  section: Section! @ref(fields: "sectionId", references: "id")
  subjectId: UUID!
  subject: Subject! @ref(fields: "subjectId", references: "id")
  weeklyLecturePeriods: Int!
  weeklyLaboratoryPeriods: Int!
  laboratoryBlockLength: Int!
}

type TimetableVersion @table @unique(fields: ["sectionId", "versionNumber"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  sectionId: UUID!
  section: Section! @ref(fields: "sectionId", references: "id")
  versionNumber: Int!
  status: TimetableStatus! @default(value: DRAFT)
  createdByUid: String!
  approvedByUid: String
  createdAt: Timestamp! @default(expr: "request.time")
  publishedAt: Timestamp
}

type TimetableEntry @table {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  timetableVersionId: UUID!
  timetableVersion: TimetableVersion! @ref(fields: "timetableVersionId", references: "id")
  subjectId: UUID!
  subject: Subject! @ref(fields: "subjectId", references: "id")
  facultyId: UUID!
  faculty: Faculty! @ref(fields: "facultyId", references: "id")
  roomId: UUID!
  room: Room! @ref(fields: "roomId", references: "id")
  dayOfWeek: DayOfWeek!
  periodNumber: Int!
  durationInPeriods: Int!
  sessionType: SessionType!
}

type GenerationJob @table {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  academicTermId: UUID!
  academicTerm: AcademicTerm! @ref(fields: "academicTermId", references: "id")
  requestedByUid: String!
  status: GenerationJobStatus! @default(value: QUEUED)
  inputSnapshot: Any!
  diagnostics: Any
  createdAt: Timestamp! @default(expr: "request.time")
  completedAt: Timestamp
}

type FacultyAbsence @table {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  facultyId: UUID!
  faculty: Faculty! @ref(fields: "facultyId", references: "id")
  startsOn: Date!
  endsOn: Date!
  reason: String
  status: AbsenceStatus! @default(value: REPORTED)
  createdByUid: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Substitution @table {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  timetableEntryId: UUID!
  timetableEntry: TimetableEntry! @ref(fields: "timetableEntryId", references: "id")
  absentFacultyId: UUID!
  absentFaculty: Faculty! @ref(fields: "absentFacultyId", references: "id")
  substituteFacultyId: UUID!
  substituteFaculty: Faculty! @ref(fields: "substituteFacultyId", references: "id")
  status: SubstitutionStatus! @default(value: PROPOSED)
  explanation: String!
  requestedByUid: String!
  approvedByUid: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type PolicyDocument @table @unique(fields: ["institutionId", "version", "title"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  title: String!
  version: Int!
  storagePath: String!
  createdByUid: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type PolicyChunk @table @unique(fields: ["documentId", "chunkNumber"]) {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  documentId: UUID!
  document: PolicyDocument! @ref(fields: "documentId", references: "id")
  chunkNumber: Int!
  pageNumber: Int
  text: String!
  embedding: Vector @col(size: 768)
}

type AuditLog @table {
  id: UUID! @default(expr: "uuidV4()")
  institutionId: String!
  institution: Institution! @ref(fields: "institutionId", references: "id")
  actorUid: String!
  action: String!
  entityType: String!
  entityId: String!
  details: Any
  createdAt: Timestamp! @default(expr: "request.time")
}
